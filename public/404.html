<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <title>Tecuiyo — Recuperando enlace</title>
    <script type="text/javascript">
      // Adaptado del patrón SPA de rafgraph/spa-github-pages (licencia MIT).
      // El dominio personalizado sirve la aplicación desde la raíz.
      // Un único valor codificado conserva la ruta, consulta y fragmento.
      var location = window.location;
      location.replace(
        location.origin + "/?__tecuiyo_route=" +
        encodeURIComponent(location.pathname + location.search + location.hash)
      );
    </script>
  </head>
  <body>
    <p>Recuperando el enlace de Tecuiyo. <a href="/">Ir al inicio</a>.</p>
  </body>
</html>
